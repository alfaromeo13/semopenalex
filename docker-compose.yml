# this is compose script to start GraphDB

services:  
  graphdb:
    container_name: graphdb
    image: ontotext/graphdb:11.1.3
    restart: unless-stopped

    ports:
      - "7200:7200"

    environment:
      GDB_JAVA_OPTS: >-
        -Xms32g
        -Xmx64g
        -Dgraphdb.home=/opt/graphdb/home
        -Dgraphdb.license.file=/etc/graphdb-license

    volumes:
      - /data/graphdb-home:/opt/graphdb/home:Z
      - /home/jovan/SemOpenAlex/semopenalex/graphdb-preload/graphdb-license/graphdb.license:/etc/graphdb-license:Z